<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cutting List Optimizer</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1, h2 {
            margin-top: 0;
            color: var(--text);
        }

        h1 { border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; }
        h2 { font-size: 1.25rem; margin-bottom: 1rem; margin-top: 1.5rem;}

        .section {
            background: #fafafa;
            padding: 1.25rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: center;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        input[type="text"], input[type="number"] {
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .diagram-container {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .board-wrapper {
            background: #fff;
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 6px;
        }

        .board-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        canvas {
            display: block;
            width: 100%;
            height: 60px;
            background: #eee;
            border-radius: 4px;
        }

        .error-message {
            color: #dc2626;
            background: #fee2e2;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cutting List Optimizer</h1>

    <div id="errorBox" class="error-message"></div>

    <!-- 1. Stock Timber Length -->
    <div class="section">
        <h2>1. Stock Timber Length</h2>
        <div class="form-group">
            <div class="input-wrapper">
                <label for="stockLength">Length (mm)</label>
                <input type="number" id="stockLength" value="4800">
            </div>
            <div class="input-wrapper">
                <label for="stockQty">Available Qty</label>
                <input type="number" id="stockQty" placeholder="Infinite">
            </div>
        </div>
        <div class="form-group">
            <div class="input-wrapper">
                <label for="kerf">Saw Blade Thickness / Kerf (mm)</label>
                <input type="number" id="kerf" value="3">
            </div>
        </div>
    </div>

    <!-- 2. Required Cuts -->
    <div class="section">
        <h2>2. Required Cuts</h2>
        <div class="input-wrapper" style="margin-bottom: 1rem;">
            <label for="requiredCuts">Enter required cuts as comma-separated lengths (mm):</label>
            <input type="text" id="requiredCuts" value="1200, 1200, 600, 600, 450, 450, 300">
        </div>
        <button id="calculateBtn">Calculate & Graph Plan</button>
    </div>

    <!-- 3. Graphical Allocation Diagram -->
    <div class="section">
        <h2>3. Graphical Allocation Diagram</h2>
        <div id="diagramContainer" class="diagram-container">
            <p style="color: #64748b; font-style: italic;">Click calculate to generate visual layout diagrams.</p>
        </div>
    </div>
</div>

<script>
    // Bind event handler securely inside script context to avoid global scope references
    document.getElementById('calculateBtn').addEventListener('click', function(e) {
        e.preventDefault();
        optimizeCuts();
    });

    function optimizeCuts() {
        const errorBox = document.getElementById('errorBox');
        const container = document.getElementById('diagramContainer');
        
        errorBox.style.display = 'none';
        container.innerHTML = '';

        // 1. Gather & parse inputs
        const stockLength = parseInt(document.getElementById('stockLength').value, 10);
        const kerf = parseInt(document.getElementById('kerf').value, 10) || 0;
        const rawCutsString = document.getElementById('requiredCuts').value;

        if (isNaN(stockLength) || stockLength <= 0) {
            showError("Please enter a valid stock timber length.");
            return;
        }

        // Clean and validate requested dimensions
        const cuts = rawCutsString.split(',')
            .map(val => parseInt(val.trim(), 10))
            .filter(val => !isNaN(val) && val > 0);

        if (cuts.length === 0) {
            showError("Please enter at least one valid cutting length dimensions.");
            return;
        }

        // Guard rails: Check if any requested cut length exceeds raw stock capacity
        const oversizedCuts = cuts.filter(c => c > stockLength);
        if (oversizedCuts.length > 0) {
            showError(`Error: Cut length (${oversizedCuts[0]}mm) is longer than your stock material (${stockLength}mm).`);
            return;
        }

        // Sort descending to optimize allocation efficiency (First-Fit Decreasing heuristic)
        cuts.sort((a, b) => b - a);

        // 2. Perform greedy allocation logic
        const boards = []; // Matrix array containing boards and their assigned segments

        cuts.forEach(cut => {
            let placed = false;

            for (let board of boards) {
                // Calculate space required to append current slice:
                // Only require trailing blade kerf structural overhead if segments exist on the board
                const spaceNeeded = board.currentUsed === 0 ? cut : cut + kerf;

                if (board.currentUsed + spaceNeeded <= stockLength) {
                    board.cuts.push(cut);
                    board.currentUsed += spaceNeeded;
                    placed = true;
                    break;
                }
            }

            // Fallback: provision a brand new board layout if segment doesn't fit existing ones
            if (!placed) {
                boards.push({
                    cuts: [cut],
                    currentUsed: cut
                });
            }
        });

        // 3. Render graphical results to Canvas layout
        boards.forEach((board, index) => {
            const boardWrapper = document.createElement('div');
            boardWrapper.className = 'board-wrapper';

            const title = document.createElement('div');
            title.className = 'board-title';
            const waste = stockLength - board.currentUsed;
            title.textContent = `Timber Board #${index + 1} (${stockLength}mm) — Used: ${board.currentUsed}mm | Leftover Waste: ${waste}mm`;
            boardWrapper.appendChild(title);

            const canvas = document.createElement('canvas');
            canvas.width = 800; // Fixed canvas execution context size
            canvas.height = 60;
            boardWrapper.appendChild(canvas);
            container.appendChild(boardWrapper);

            drawBoardDiagram(canvas, board.cuts, stockLength, kerf);
        });
    }

    function drawBoardDiagram(canvas, cuts, stockLength, kerf) {
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        const scale = W / stockLength;

        // Distinct colors for visual segments layout allocation differentiation
        const colors = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#14b8a6'];

        ctx.clearRect(0, 0, W, H);
        let currentX = 0;

        cuts.forEach((cut, i) => {
            // Pick slice visual color fill index loop iteration
            const color = colors[i % colors.length];
            const cutWidth = cut * scale;

            // Draw primary component plank cutout slice segment representation
            ctx.fillStyle = color;
            ctx.fillRect(currentX, 0, cutWidth, H);

            // Text Label
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            if (cutWidth > 40) { // Only render numerical labels if component box size permits visibility
                ctx.fillText(`${cut}mm`, currentX + (cutWidth / 2), H / 2);
            }

            currentX += cutWidth;
